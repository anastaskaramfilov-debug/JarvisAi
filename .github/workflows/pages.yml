name: Publish the phone app

on:
  push:
    branches: [main]
    paths: ["phone/**", "web/css/**", "web/js/icons.js"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          persist-credentials: false
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b   # v5
      - name: Assemble the phone app (it shares the PC app's design files)
        run: |
          mkdir -p _site
          cp -r phone/. _site/
          mkdir -p _site/pc
          cp web/css/tokens.css web/css/app.css web/js/icons.js _site/pc/
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa   # v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e   # v4

name: Build Jarvis

on:
  push:
    branches: [main]
    paths: ["VERSION"]    # a new number in VERSION builds the installer and publishes it as release vX.Y.Z
  workflow_dispatch:      # or run it by hand from the Actions tab

# Least privilege: the build itself can only read the repo. Only the small release job can publish.
permissions:
  contents: read

concurrency:
  group: build-jarvis
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      # Third-party actions are pinned to exact commits, so a changed tag can't slip new code into the build
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5
        with:
          python-version: "3.12"

      - name: Version
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "VERSION must look like 2.2.1" }
          Set-Content -Path version.txt -Value $v -NoNewline
          Set-Content -Path repo.txt -Value $env:GITHUB_REPOSITORY -NoNewline
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-app.txt

      - name: Check that Jarvis starts (imports only)
        env:
          JARVIS_DATA: ${{ runner.temp }}\jarvis-data
        run: python -c "import jarvis_server, jarvis_connectors, webview, pystray; print('imports ok')"

      - name: Build Jarvis.exe
        run: pyinstaller packaging/jarvis.spec --noconfirm --clean

      - name: Build the installer
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DMyVersion=$env:VERSION" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem dist-installer\*.exe | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content -Path dist-installer\SHA256SUMS.txt -Encoding ascii
          Get-Content dist-installer\SHA256SUMS.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with:
          name: jarvis-installer
          path: |
            dist-installer/*.exe
            dist-installer/SHA256SUMS.txt
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4
        with:
          name: jarvis-installer
          path: out

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65   # v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Jarvis ${{ needs.build.outputs.version }}
          files: |
            out/*.exe
            out/SHA256SUMS.txt
          body: |
            Download **Jarvis-Setup-${{ needs.build.outputs.version }}.exe** below and run it.
            Already installed? Jarvis downloads this update by himself, checks it, and asks you to restart.
            SHA-256 checksums are in SHA256SUMS.txt.
